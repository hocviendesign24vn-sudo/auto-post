name: Quét tin CareerViet, đăng timviecso.vn

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: quet-tin
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m autopost.careerviet --max 5
        env:
          TIMVIECSO_TOKEN: ${{ secrets.TIMVIECSO_TOKEN }}
