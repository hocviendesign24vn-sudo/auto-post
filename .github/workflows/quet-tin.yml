name: Quét tin CareerViet, đăng timviecso.vn

# Lịch của GitHub hay trễ hoặc bỏ lượt, nên mỗi lần chạy giữ máy khoảng 50 phút và tự quét
# 5 phút một lần. Lịch 15 phút chỉ để có sẵn lần chạy kế tiếp: concurrency giữ đúng một lần
# đang chạy và một lần chờ, lần chạy chờ bắt đầu ngay khi lần trước xong.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: quet-tin
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m autopost.careerviet --max 2 --loop-minutes 50 --every 5
        env:
          TIMVIECSO_TOKEN: ${{ secrets.TIMVIECSO_TOKEN }}
