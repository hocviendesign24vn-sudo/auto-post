name: Quét tin CareerViet, đăng timviecso.vn

# Khoảng 2 giờ đăng 1 tin mới nhất (Cần Thơ, ĐBSCL). Lịch GitHub có thể trễ vài chục phút.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: quet-tin
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m autopost.careerviet --max 1
        env:
          TIMVIECSO_TOKEN: ${{ secrets.TIMVIECSO_TOKEN }}
