name: Quét tin CareerViet, đăng timviecso.vn

# Chạy tay khi cần. Lịch 2 giờ một tin do tác vụ Claude "Đăng timviecso.vn (2 giờ 1 tin)" đảm nhận,
# vì lịch của GitHub bỏ lượt khi mới bật.
on:
  workflow_dispatch:

concurrency:
  group: quet-tin
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m autopost.careerviet --max 1
        env:
          TIMVIECSO_TOKEN: ${{ secrets.TIMVIECSO_TOKEN }}
